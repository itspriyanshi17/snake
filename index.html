<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9bbc0f">
<title>Retro LCD Snake</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Layout: the whole page is the LCD. Score bar on top, the board (always fully visible),
     and a message panel under it. Swipe anywhere on the screen to play. */
  :root {
    color-scheme: light;
    --lcd: #9bbc0f;       /* screen green, page background */
    --lcd-2: #8bac0f;     /* light shade                    */
    --lcd-3: #306230;     /* mid shade, secondary text      */
    --ink: #0f380f;       /* darkest shade, main ink        */
    --font: "Press Start 2P", "Courier New", monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    overscroll-behavior: none;   /* no pull-to-refresh while swiping */
  }

  body {
    margin: 0;
    background: var(--lcd);
    color: var(--ink);
    font-family: var(--font);
    overflow: hidden;
    touch-action: none;          /* every swipe goes to the game */
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    height: 100%;
    max-width: 640px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    padding-top: max(12px, env(safe-area-inset-top, 0px));
    padding-bottom: max(12px, env(safe-area-inset-bottom, 0px));
    padding-inline: 16px;
  }

  /* ---------- Top bar ---------- */
  .hud { display: flex; align-items: center; gap: 12px; }
  .stats {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: end;
    gap: 8px;
  }
  .stat { display: flex; flex-direction: column; gap: 6px; }
  .stat:nth-child(2) { align-items: center; }
  .stat:nth-child(3) { align-items: flex-end; }
  .stat .k { font-size: 8px; color: var(--lcd-3); letter-spacing: 0.12em; }
  .stat .v { font-size: clamp(14px, 4.4vw, 20px); font-variant-numeric: tabular-nums; display: inline-block; }
  .stat .v.bump { animation: bump 0.25s steps(2) 1; }
  @keyframes bump { 0% { transform: scale(1.35); } 100% { transform: none; } }

  .icons { display: flex; gap: 8px; }
  button {
    appearance: none;
    width: 40px;
    height: 40px;
    padding: 0;
    color: var(--ink);
    background: var(--lcd);
    border: 3px solid var(--ink);
    border-radius: 0;
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  button svg { width: 18px; height: 18px; fill: currentColor; }
  button:active, button.pressed { background: var(--ink); color: var(--lcd); }
  button:focus-visible { outline: 3px dashed var(--lcd-3); outline-offset: 2px; }
  button[hidden] { display: none; }

  /* ---------- Board + message, centred together ---------- */
  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .timer { width: 100%; height: 6px; border: 2px solid var(--ink); visibility: hidden; }
  .timer.on { visibility: visible; }
  .timer i { display: block; height: 100%; width: 0; background: var(--ink); }

  .board-col {
    width: min(100%, calc(100svh - 270px));
    min-width: 200px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 4px solid var(--ink);
    cursor: pointer;
  }
  .board.shake { animation: shake 0.35s steps(1) 1; }
  @keyframes shake {
    0%   { transform: translate(-6px, 2px); }
    20%  { transform: translate(6px, -2px); }
    40%  { transform: translate(-4px, -2px); }
    60%  { transform: translate(4px, 2px); }
    80%  { transform: translate(-2px, 0); }
    100% { transform: none; }
  }
  canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated; }

  .toast {
    position: absolute;
    left: 50%;
    top: 8px;
    transform: translateX(-50%);
    background: var(--ink);
    color: var(--lcd);
    font-size: clamp(10px, 3vw, 13px);
    padding: 8px 10px;
    white-space: nowrap;
    pointer-events: none;
  }
  .flash { position: absolute; inset: 0; background: var(--ink); pointer-events: none; }

  /* Message panel under the board: never covers the snake */
  .panel {
    width: 100%;
    min-height: 118px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    text-align: center;
    line-height: 1.6;
  }
  .p-title { font-size: clamp(20px, 6.5vw, 30px); }
  .p-row   { font-size: clamp(10px, 3vw, 13px); display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; }
  .p-cta   { font-size: clamp(10px, 3vw, 13px); }
  .p-hint  { font-size: 9px; color: var(--lcd-3); }
  .p-badge { font-size: 10px; background: var(--ink); color: var(--lcd); padding: 6px 8px; }
  .swipe-icon { width: 44px; height: 44px; fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: square; }
  .blink { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { visibility: hidden; } }

  @media (prefers-reduced-motion: reduce) {
    .board.shake, .stat .v.bump { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="hud">
    <div class="stats">
      <div class="stat"><span class="k">SCORE</span><span class="v" id="score">0000</span></div>
      <div class="stat"><span class="k">LEVEL</span><span class="v" id="level">1</span></div>
      <div class="stat"><span class="k">BEST</span><span class="v" id="best">0000</span></div>
    </div>
    <div class="icons">
      <button id="btnPause" type="button" aria-label="Pause"></button>
      <button id="btnSound" type="button" aria-label="Sound on or off"></button>
      <button id="btnFull" type="button" aria-label="Full screen" hidden>
        <svg viewBox="0 0 20 20"><path d="M2 2h6v3H5v3H2zm10 0h6v6h-3V5h-3zM2 12h3v3h3v3H2zm13 0h3v6h-6v-3h3z"/></svg>
      </button>
    </div>
  </header>

  <main class="main">
    <div class="board-col">
      <div class="timer" id="timer"><i id="timerBar"></i></div>
      <div class="board" id="board">
        <canvas id="canvas" aria-label="Snake board"></canvas>
        <div class="toast" id="toast" hidden></div>
        <div class="flash" id="flash" hidden></div>
      </div>
    </div>
    <div class="panel" id="panel" aria-live="polite"></div>
  </main>
</div>

<script>
(() => {
  "use strict";

  /* =========================================================
     CONFIG
     ========================================================= */
  const COLS = 20, ROWS = 20;
  const BASE_DELAY = 150;          // ms per step at level 1
  const SPEED_STEP = 12;           // ms faster per level
  const MIN_DELAY = 60;
  const FOODS_PER_LEVEL = 5;       // level up (and bonus bug) every N foods
  const BONUS_STEPS = 30;          // steps before the bonus bug runs away
  const DEATH_MS = 900;            // input is ignored this long after a crash
  const SWIPE_MIN = 20;            // px of finger travel that counts as a swipe

  const C = { bg: "#9bbc0f", grid: "#94b50e", light: "#8bac0f", mid: "#306230", dark: "#0f380f" };

  const HIGH_KEY = "retroSnake.highScore";
  const MUTE_KEY = "retroSnake.muted";

  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  };
  const KEY_DIRS = {
    arrowup: "up", w: "up", arrowdown: "down", s: "down",
    arrowleft: "left", a: "left", arrowright: "right", d: "right",
  };

  const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TOUCH = matchMedia("(pointer: coarse)").matches;

  // 8x8 pixel sprites. d = dark, m = mid, l = light, . = transparent
  const APPLE = [
    "....d...",
    "...d.mm.",
    ".dddddd.",
    "dmmmmlmd",
    "dmmmmmmd",
    "dmmmmmmd",
    ".dmmmmd.",
    "..dd.dd.",
  ];
  const BUG = [
    "d......d",
    ".d.dd.d.",
    "..dmmd..",
    "ddmllmdd",
    "..dmmd..",
    "ddmmmmdd",
    "..dmmd..",
    ".d.dd.d.",
  ];

  const ICONS = {
    soundOn:  '<svg viewBox="0 0 20 20"><path d="M2 7h4l5-4v14l-5-4H2zm11 0h2v6h-2zm3-3h2v12h-2z"/></svg>',
    soundOff: '<svg viewBox="0 0 20 20"><path d="M2 7h4l5-4v14l-5-4H2zm11 0 2 2 2-2 1 1-2 2 2 2-1 1-2-2-2 2-1-1 2-2-2-2z"/></svg>',
    pause:    '<svg viewBox="0 0 20 20"><path d="M4 3h4v14H4zm8 0h4v14h-4z"/></svg>',
    play:     '<svg viewBox="0 0 20 20"><path d="M5 2l12 8-12 8z"/></svg>',
    swipe:    '<svg class="swipe-icon" viewBox="0 0 44 44" aria-hidden="true"><path d="M22 4v36M4 22h36M22 4l-6 6M22 4l6 6M22 40l-6-6M22 40l6-6M4 22l6-6M4 22l6 6M40 22l-6-6M40 22l-6 6"/></svg>',
  };

  /* =========================================================
     STORAGE
     ========================================================= */
  const load = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, String(v)); } catch { /* ignore */ } };

  /* =========================================================
     SOUND
     ========================================================= */
  let audioCtx = null;
  let muted = load(MUTE_KEY) === "1";

  // Browsers only allow audio after a user gesture, so every input handler calls this.
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch { audioCtx = null; }
  }

  function beep(freq, dur, offset = 0, vol = 0.06) {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime + offset;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = "square";
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(vol, t);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.01);
  }

  const sfx = {
    eat()   { beep(880, 0.05); beep(1320, 0.05, 0.05); },
    bonus() { [660, 880, 1100, 1320].forEach((f, i) => beep(f, 0.05, i * 0.05)); },
    level() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.08, i * 0.09)); },
    start() { beep(784, 0.06); beep(1047, 0.1, 0.07); },
    pause() { beep(600, 0.06); },
    over()  { beep(392, 0.15); beep(311, 0.15, 0.16); beep(247, 0.15, 0.32); beep(165, 0.4, 0.48); },
    win()   { [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, 0.12, i * 0.12)); },
  };

  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch { /* ignore */ } };

  /* =========================================================
     GAME ENGINE
     ========================================================= */
  const same = (a, b) => a.x === b.x && a.y === b.y;

  class Game {
    constructor() { this.reset(); }

    reset() {
      const cx = COLS >> 1, cy = ROWS >> 1;
      // 3 blocks in the middle, moving right
      this.snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
      this.dir = DIRS.right;
      this.queue = [];     // buffered turns, applied one per step
      this.score = 0;
      this.eaten = 0;
      this.bonus = null;   // {x, y, left}
      this.food = null;
      this.food = this.freeCell();
    }

    get level() { return Math.floor(this.eaten / FOODS_PER_LEVEL) + 1; }
    get delay() { return Math.max(MIN_DELAY, BASE_DELAY - (this.level - 1) * SPEED_STEP); }
    get toNextLevel() { return FOODS_PER_LEVEL - (this.eaten % FOODS_PER_LEVEL); }

    // Random cell not covered by the snake, food or bonus. null if none left.
    freeCell() {
      const taken = new Set(this.snake.map(s => s.y * COLS + s.x));
      if (this.food) taken.add(this.food.y * COLS + this.food.x);
      if (this.bonus) taken.add(this.bonus.y * COLS + this.bonus.x);
      const free = [];
      for (let i = 0; i < COLS * ROWS; i++) if (!taken.has(i)) free.push(i);
      if (!free.length) return null;
      const i = free[Math.floor(Math.random() * free.length)];
      return { x: i % COLS, y: Math.floor(i / COLS) };
    }

    // Queue a turn. Each queued turn is checked against the direction before it,
    // so quick swipes (e.g. up then left) work but can never reverse the snake into itself.
    // Only one queued turn is applied per step.
    turn(name) {
      const next = DIRS[name];
      if (!next) return;
      const last = this.queue.length ? this.queue[this.queue.length - 1] : this.dir;
      if (next === last || (next.x === -last.x && next.y === -last.y)) return;
      if (this.queue.length < 2) this.queue.push(next);
    }

    step() {
      if (this.queue.length) this.dir = this.queue.shift();
      const head = this.snake[0];
      const next = { x: head.x + this.dir.x, y: head.y + this.dir.y };

      if (next.x < 0 || next.x >= COLS || next.y < 0 || next.y >= ROWS) return { dead: true };

      const eating = this.food && same(next, this.food);
      // The tail leaves its cell this step unless we grow, so that cell is safe.
      const body = eating ? this.snake : this.snake.slice(0, -1);
      if (body.some(s => same(s, next))) return { dead: true };

      this.snake.unshift(next);
      const r = {};

      if (this.bonus && same(next, this.bonus)) {
        r.bonus = 2 + Math.ceil((this.bonus.left / BONUS_STEPS) * 8);   // 3..10, quicker = more
        r.at = { ...next };
        this.score += r.bonus;
        this.bonus = null;
      }

      if (eating) {
        this.score++;
        this.eaten++;
        r.ate = true;
        r.at = r.at || { ...next };
        this.food = null;
        this.food = this.freeCell();
        if (this.eaten % FOODS_PER_LEVEL === 0) {
          r.levelUp = true;
          this.bonus = null;
          const cell = this.freeCell();
          if (cell) this.bonus = { ...cell, left: BONUS_STEPS };
        }
        if (!this.food) r.won = true;
      } else {
        this.snake.pop();
      }

      if (this.bonus && !r.levelUp && --this.bonus.left <= 0) this.bonus = null;
      return r;
    }
  }

  /* =========================================================
     DOM
     ========================================================= */
  const $ = id => document.getElementById(id);
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d");
  const board = $("board");
  const panel = $("panel");
  const toast = $("toast");
  const flash = $("flash");
  const scoreEl = $("score"), levelEl = $("level"), bestEl = $("best");
  const timer = $("timer"), timerBar = $("timerBar");
  const btnPause = $("btnPause"), btnSound = $("btnSound"), btnFull = $("btnFull");

  /* =========================================================
     RENDERING (whole device pixels per cell, so edges stay sharp)
     ========================================================= */
  let cell = 16;

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    cell = Math.max(8, Math.floor((canvas.clientWidth * dpr) / COLS));
    canvas.width = canvas.height = cell * COLS;
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // Edge of sub-pixel unit i (of 8) inside a cell, rounded so units tile without gaps
  const u = i => Math.round((i * cell) / 8);

  function drawSprite(rows, cx, cy) {
    const ox = cx * cell, oy = cy * cell;
    const col = { d: C.dark, m: C.mid, l: C.light };
    rows.forEach((row, j) => {
      for (let i = 0; i < 8; i++) {
        const c = row[i];
        if (c === ".") continue;
        ctx.fillStyle = col[c];
        ctx.fillRect(ox + u(i), oy + u(j), u(i + 1) - u(i), u(j + 1) - u(j));
      }
    });
  }

  function circle(x, y, r, color) {
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // Round snake: a smooth tube through the cell centres, thinning towards the tail,
  // with a round head. Every segment still sits exactly on one grid cell.
  function drawSnake(g, t, dead) {
    const s = g.snake;
    const cx = p => (p.x + 0.5) * cell;
    const cy = p => (p.y + 0.5) * cell;
    // Radius tapers from 0.42 cell at the neck to 0.28 at the tail tip
    const radius = i => cell * (0.42 - 0.14 * (s.length > 1 ? i / (s.length - 1) : 0));

    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    const tube = (color, shrink) => {
      ctx.strokeStyle = color;
      for (let i = s.length - 1; i >= 1; i--) {
        ctx.lineWidth = Math.max(2, radius(i) * 2 - shrink);
        ctx.beginPath();
        ctx.moveTo(cx(s[i]), cy(s[i]));
        ctx.lineTo(cx(s[i - 1]), cy(s[i - 1]));
        ctx.stroke();
      }
    };
    tube(C.dark, 0);             // outline
    tube(C.mid, cell * 0.22);    // inside
    for (let i = 2; i < s.length; i += 2) circle(cx(s[i]), cy(s[i]), radius(i) * 0.32, C.light);

    // Head
    const h = s[0], d = g.dir;
    const hx = cx(h), hy = cy(h);
    circle(hx, hy, cell * 0.48, C.dark);

    const side = { x: -d.y, y: d.x };   // perpendicular to movement
    for (const k of [-1, 1]) {
      const ex = hx + d.x * cell * 0.04 + side.x * k * cell * 0.24;
      const ey = hy + d.y * cell * 0.04 + side.y * k * cell * 0.24;
      if (dead) {
        // X eyes after a crash
        const r = cell * 0.1;
        ctx.strokeStyle = C.bg;
        ctx.lineWidth = Math.max(1.5, cell * 0.06);
        ctx.beginPath();
        ctx.moveTo(ex - r, ey - r); ctx.lineTo(ex + r, ey + r);
        ctx.moveTo(ex + r, ey - r); ctx.lineTo(ex - r, ey + r);
        ctx.stroke();
      } else {
        circle(ex, ey, cell * 0.12, C.bg);
        circle(ex + d.x * cell * 0.04, ey + d.y * cell * 0.04, cell * 0.055, C.dark);
      }
    }

    // Open mouth when food is right ahead
    const ahead = { x: h.x + d.x, y: h.y + d.y };
    if (!dead && ((g.food && same(ahead, g.food)) || (g.bonus && same(ahead, g.bonus))) && Math.floor(t / 110) % 2) {
      const ang = Math.atan2(d.y, d.x);
      ctx.fillStyle = C.bg;
      ctx.beginPath();
      ctx.moveTo(hx + d.x * cell * 0.15, hy + d.y * cell * 0.15);
      ctx.arc(hx, hy, cell * 0.5, ang - 0.5, ang + 0.5);
      ctx.closePath();
      ctx.fill();
    }
  }

  // Little squares that burst from eaten food
  let particles = [];
  function burst(at, n = 8) {
    if (REDUCED_MOTION) return;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.4;
      const sp = 3 + Math.random() * 3;
      particles.push({ x: at.x + 0.5, y: at.y + 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, born: performance.now() });
    }
  }

  function drawParticles(t) {
    particles = particles.filter(p => t - p.born < 380);
    ctx.fillStyle = C.dark;
    const size = Math.max(2, u(2));
    for (const p of particles) {
      const k = (t - p.born) / 1000;
      ctx.fillRect(Math.round((p.x + p.vx * k) * cell - size / 2), Math.round((p.y + p.vy * k) * cell - size / 2), size, size);
    }
  }

  function draw(t) {
    ctx.fillStyle = C.bg;
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Faint cell grid for that LCD texture
    ctx.fillStyle = C.grid;
    for (let i = 1; i < COLS; i++) {
      ctx.fillRect(i * cell, 0, 1, canvas.height);
      ctx.fillRect(0, i * cell, canvas.width, 1);
    }

    if (game.food) drawSprite(APPLE, game.food.x, game.food.y);
    if (game.bonus && !(game.bonus.left <= 8 && Math.floor(t / 120) % 2)) drawSprite(BUG, game.bonus.x, game.bonus.y);

    const dead = state === "dying" || state === "over";
    const blinkOff = state === "dying" && Math.floor((t - stateAt) / 120) % 2 === 1;
    if (!blinkOff) drawSnake(game, t, dead);
    drawParticles(t);
  }

  /* =========================================================
     STATE + UI
     ========================================================= */
  // "ready" | "running" | "paused" | "dying" | "over"
  let state = "ready";
  let stateAt = 0;
  let won = false;
  const game = new Game();
  let highScore = parseInt(load(HIGH_KEY), 10) || 0;
  let highAtStart = highScore;
  let acc = 0, lastTime = 0;
  let toastTimer = 0;

  const pad4 = n => String(Math.min(n, 9999)).padStart(4, "0");

  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  function updateHud() {
    scoreEl.textContent = pad4(game.score);
    levelEl.textContent = game.level;
    bestEl.textContent = pad4(highScore);
  }

  function updateButtons() {
    btnSound.innerHTML = muted ? ICONS.soundOff : ICONS.soundOn;
    btnSound.setAttribute("aria-label", muted ? "Turn sound on" : "Turn sound off");
    const paused = state === "paused";
    btnPause.innerHTML = paused ? ICONS.play : ICONS.pause;
    btnPause.setAttribute("aria-label", paused ? "Resume" : "Pause");
    btnPause.hidden = !(state === "running" || paused);
  }

  function showToast(text, ms = 1400) {
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, ms);
  }

  // The message panel sits under the board, so the snake is always visible.
  function renderPanel() {
    const go = TOUCH ? "SWIPE TO PLAY" : "PRESS AN ARROW KEY";
    if (state === "ready") {
      panel.innerHTML = `
        <div class="p-title">SNAKE</div>
        ${TOUCH ? ICONS.swipe : ""}
        <div class="p-cta blink">${go}</div>
        <div class="p-hint">${TOUCH ? "SWIPE UP, DOWN, LEFT OR RIGHT TO TURN" : "ARROWS / WASD TURN &middot; SPACE PAUSE"}</div>`;
    } else if (state === "running" || state === "dying") {
      const n = game.toNextLevel;
      panel.innerHTML = `
        <div class="p-row"><span>${n} MORE TO LEVEL ${game.level + 1}</span></div>
        <div class="p-hint">${TOUCH ? "SWIPE ANYWHERE TO TURN" : "ARROWS / WASD TURN &middot; SPACE PAUSE"}</div>`;
    } else if (state === "paused") {
      panel.innerHTML = `
        <div class="p-title">PAUSED</div>
        <div class="p-cta blink">${TOUCH ? "TAP TO RESUME" : "PRESS SPACE"}</div>`;
    } else if (state === "over") {
      const record = game.score > highAtStart;
      panel.innerHTML = `
        <div class="p-title">${won ? "YOU WIN!" : "GAME OVER"}</div>
        <div class="p-row"><span>SCORE ${game.score}</span><span>BEST ${highScore}</span></div>
        ${record ? '<div class="p-badge">NEW BEST!</div>' : ""}
        <div class="p-cta blink">${TOUCH ? "SWIPE OR TAP TO RETRY" : "PRESS SPACE TO RETRY"}</div>`;
    }
  }

  function setState(next) {
    state = next;
    stateAt = performance.now();
    renderPanel();
    updateHud();
    updateButtons();
  }

  function startGame() {
    game.reset();
    highAtStart = highScore;
    won = false;
    acc = 0;
    particles = [];
    toast.hidden = true;
    sfx.start();
    setState("running");
  }

  function pause() {
    if (state !== "running") return;
    sfx.pause();
    setState("paused");
  }

  function resume() {
    if (state !== "paused") return;
    acc = 0;
    sfx.pause();
    setState("running");
  }

  function finish(didWin) {
    won = didWin;
    if (didWin) sfx.win(); else sfx.over();
    buzz(didWin ? [40, 60, 40] : 150);
    if (!didWin && !REDUCED_MOTION) {
      board.classList.remove("shake");
      void board.offsetWidth;
      board.classList.add("shake");
      flash.hidden = false;
      setTimeout(() => { flash.hidden = true; }, 80);
    }
    setState("dying");
  }

  // Tap / Space: start, resume or retry. (Pausing mid-game is the pause button or Space.)
  function primaryAction(fromTap) {
    if (state === "ready" || state === "over") startGame();
    else if (state === "paused") resume();
    else if (state === "running" && !fromTap) pause();
  }

  // A swipe or arrow key: steers, and also starts a new game from the ready / game-over screen.
  function steer(name) {
    if (state === "ready" || state === "over") startGame();
    if (state === "running") game.turn(name);
  }

  function toggleMute() {
    muted = !muted;
    save(MUTE_KEY, muted ? "1" : "0");
    if (!muted) beep(880, 0.06);
    updateButtons();
    showToast(muted ? "SOUND OFF" : "SOUND ON", 900);
  }

  // Full screen is optional: some browsers don't allow it
  function toggleFullscreen() {
    try {
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(() => showToast("FULL SCREEN BLOCKED", 1200));
    } catch { showToast("FULL SCREEN BLOCKED", 1200); }
  }
  if (document.fullscreenEnabled) btnFull.hidden = false;

  function handleStep(r) {
    if (r.dead) { finish(false); return; }
    if (r.bonus) {
      sfx.bonus();
      buzz(25);
      burst(r.at, 12);
      showToast(`BONUS +${r.bonus}`, 900);
    }
    if (r.ate) {
      burst(r.at);
      if (r.levelUp) { sfx.level(); showToast(`LEVEL ${game.level}`); bump(levelEl); }
      else if (!r.bonus) { sfx.eat(); buzz(10); }
      renderPanel();
    }
    if (r.ate || r.bonus) {
      if (game.score > highScore) {
        highScore = game.score;
        save(HIGH_KEY, highScore);
      }
      updateHud();
      bump(scoreEl);
    }
    if (r.won) finish(true);
  }

  /* =========================================================
     MAIN LOOP
     ========================================================= */
  function loop(t) {
    const dt = t - lastTime;
    lastTime = t;

    if (state === "running") {
      acc = Math.min(acc + dt, game.delay * 2);   // no fast-forward after a hiccup
      while (state === "running" && acc >= game.delay) {
        acc -= game.delay;
        handleStep(game.step());
      }
    } else if (state === "dying" && t - stateAt >= DEATH_MS) {
      setState("over");
    }

    // Bonus timer bar above the board
    const showTimer = (state === "running" || state === "paused") && !!game.bonus;
    timer.classList.toggle("on", showTimer);
    if (showTimer) timerBar.style.width = (game.bonus.left / BONUS_STEPS) * 100 + "%";

    draw(t);
    requestAnimationFrame(loop);
  }

  /* =========================================================
     INPUT
     ========================================================= */
  function press(el) {
    el.classList.add("pressed");
    setTimeout(() => el.classList.remove("pressed"), 110);
  }

  // Keyboard (desktop)
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key.toLowerCase();
    unlockAudio();

    if (KEY_DIRS[key]) {
      e.preventDefault();
      steer(KEY_DIRS[key]);
    } else if (key === " " || key === "enter") {
      e.preventDefault();
      if (!e.repeat) primaryAction(false);
    } else if (key === "p" || key === "escape") {
      if (!e.repeat) { state === "running" ? pause() : resume(); }
    } else if (key === "m") {
      if (!e.repeat) { toggleMute(); press(btnSound); }
    } else if (key === "f") {
      if (!e.repeat && !btnFull.hidden) toggleFullscreen();
    }
  });

  // Top-bar buttons react on pointerdown (instant on phones). click with detail 0 = keyboard Enter.
  function bindButton(el, action) {
    el.addEventListener("pointerdown", e => {
      e.preventDefault();
      e.stopPropagation();
      unlockAudio();
      action();
    });
    el.addEventListener("click", e => { if (e.detail === 0) { unlockAudio(); action(); } });
  }
  bindButton(btnPause, () => (state === "paused" ? resume() : pause()));
  bindButton(btnSound, toggleMute);
  bindButton(btnFull, toggleFullscreen);

  // Swipe anywhere on the screen. The turn happens as soon as the finger has moved
  // far enough (no need to lift it), and you can keep sliding to chain turns.
  let touch = null;
  const onButton = e => e.target.closest && e.target.closest("button");

  document.addEventListener("touchstart", e => {
    if (onButton(e)) return;
    e.preventDefault();
    unlockAudio();
    const t = e.changedTouches[0];
    touch = { x: t.clientX, y: t.clientY, swiped: false };
  }, { passive: false });

  document.addEventListener("touchmove", e => {
    if (!touch) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    if (state !== "dying") {
      steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
      buzz(6);
    }
    touch = { x: t.clientX, y: t.clientY, swiped: true };
  }, { passive: false });

  document.addEventListener("touchend", e => {
    if (!touch) return;
    e.preventDefault();
    if (!touch.swiped) primaryAction(true);   // tap: start / resume / retry
    touch = null;
  }, { passive: false });

  // Mouse click on the board (desktop) works like a tap
  board.addEventListener("click", () => { unlockAudio(); primaryAction(true); });

  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

  /* =========================================================
     BOOT
     ========================================================= */
  setState("ready");
  requestAnimationFrame(t => { lastTime = t; loop(t); });
})();
</script>
</body>
</html>
