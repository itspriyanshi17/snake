<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Dot Snake</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap">
<style>
  /* Layout: black page, a dot-matrix board, and a rounded "composer" bar under it that
     shows the game status and holds the play / pause button. Swipe anywhere to steer. */
  :root {
    color-scheme: dark;
    --bg: #000000;
    --surface: #1e1e1e;      /* bar + buttons        */
    --surface-2: #2b2b2b;    /* hover / pressed      */
    --line: #262626;         /* board outline        */
    --fg: #ececec;           /* main text            */
    --muted: #8e8e8e;        /* secondary text       */
    --blue: #2f7cf6;         /* snake + food + CTA   */
    --font: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    overscroll-behavior: none;   /* no pull-to-refresh while swiping */
  }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--font);
    overflow: hidden;
    touch-action: none;          /* every swipe goes to the game */
    -webkit-user-select: none;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
  }

  .app {
    height: 100%;
    max-width: 620px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
    padding-top: max(14px, env(safe-area-inset-top, 0px));
    padding-bottom: max(14px, env(safe-area-inset-bottom, 0px));
    padding-inline: 16px;
  }

  /* ---------- Top bar ---------- */
  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .brand { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
  .icons { display: flex; gap: 6px; }

  .icon {
    appearance: none;
    width: 40px;
    height: 40px;
    border: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--fg);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .icon svg { width: 20px; height: 20px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .icon:active, .icon.pressed { background: var(--surface-2); }
  .icon[hidden] { display: none; }
  button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

  .stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 999px;
    background: var(--surface);
    font-size: 13px;
  }
  .chip .k { color: var(--muted); }
  .chip .v { font-weight: 700; font-variant-numeric: tabular-nums; display: inline-block; }
  .chip .v.bump { animation: bump 0.3s ease-out 1; }
  @keyframes bump { 0% { transform: scale(1.4); color: var(--blue); } 100% { transform: none; } }

  /* ---------- Board + bar, centred together ---------- */
  .main {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
  }

  .board-col {
    width: min(100%, calc(100svh - 330px));
    min-width: 220px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .timer { height: 3px; border-radius: 2px; background: var(--surface); visibility: hidden; overflow: hidden; }
  .timer.on { visibility: visible; }
  .timer i { display: block; height: 100%; width: 0; background: var(--blue); }

  .board {
    position: relative;
    width: 100%;
    aspect-ratio: 1 / 1;
    border: 1px solid var(--line);
    border-radius: 18px;
    overflow: hidden;
    cursor: pointer;
  }
  .board.shake { animation: shake 0.35s ease-out 1; }
  @keyframes shake {
    0%, 100% { transform: none; }
    20% { transform: translateX(-6px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(2px); }
  }
  canvas { display: block; width: 100%; height: 100%; }

  .toast {
    position: absolute;
    left: 50%;
    top: 12px;
    transform: translateX(-50%);
    background: var(--surface-2);
    color: var(--fg);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ---------- Status heading + composer bar ---------- */
  .status {
    width: 100%;
    min-height: 52px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 6px;
  }
  .status h1 { margin: 0; font-size: clamp(18px, 5vw, 22px); font-weight: 500; text-wrap: balance; }
  .status p  { margin: 0; font-size: 12px; color: var(--muted); }

  .bar {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 8px 8px 20px;
    border-radius: 999px;
    background: var(--surface);
  }
  .bar-text { flex: 1; min-width: 0; font-size: 15px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .bar-text b { color: var(--fg); font-weight: 500; }

  .go {
    appearance: none;
    width: 48px;
    height: 48px;
    flex: none;
    border: 0;
    border-radius: 50%;
    background: var(--blue);
    color: #ffffff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    touch-action: manipulation;
  }
  .go svg { width: 18px; height: 18px; fill: currentColor; }
  .go:active, .go.pressed { transform: scale(0.94); }

  .foot { font-size: 11px; color: var(--muted); text-align: center; margin: 0; }

  @media (prefers-reduced-motion: reduce) {
    .board.shake, .chip .v.bump { animation: none; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Snake</div>
    <div class="icons">
      <button class="icon" id="btnSound" type="button" aria-label="Sound on or off"></button>
      <button class="icon" id="btnFull" type="button" aria-label="Full screen" hidden>
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <div class="stats">
    <div class="chip"><span class="k">Score</span><span class="v" id="score">0</span></div>
    <div class="chip"><span class="k">Best</span><span class="v" id="best">0</span></div>
    <div class="chip"><span class="k">Level</span><span class="v" id="level">1</span></div>
  </div>

  <main class="main">
    <div class="board-col">
      <div class="timer" id="timer"><i id="timerBar"></i></div>
      <div class="board" id="board">
        <canvas id="canvas" aria-label="Snake board"></canvas>
        <div class="toast" id="toast" hidden></div>
      </div>
    </div>

    <div class="board-col">
      <div class="status" id="status" aria-live="polite"></div>
      <div class="bar">
        <div class="bar-text" id="barText"></div>
        <button class="go" id="btnGo" type="button" aria-label="Play"></button>
      </div>
      <p class="foot" id="foot"></p>
    </div>
  </main>
</div>

<script>
(() => {
  "use strict";

  /* =========================================================
     CONFIG
     ========================================================= */
  const COLS = 20, ROWS = 20;
  const BASE_DELAY = 150;          // ms per step at level 1
  const SPEED_STEP = 12;           // ms faster per level
  const MIN_DELAY = 60;
  const FOODS_PER_LEVEL = 5;       // level up (and bonus dot) every N foods
  const BONUS_STEPS = 30;          // steps before the bonus dot disappears
  const DEATH_MS = 900;            // input is ignored this long after a crash
  const SWIPE_MIN = 16;            // px of finger travel that counts as a swipe

  // Canvas colours (match the CSS tokens)
  const C = { grid: "#2a2a2a", blue: "#2f7cf6", eye: "#0a1f44", dead: "#5a5a5a", white: "#ffffff" };

  const HIGH_KEY = "dotSnake.highScore";
  const MUTE_KEY = "dotSnake.muted";

  const DIRS = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  };
  const KEY_DIRS = {
    arrowup: "up", w: "up", arrowdown: "down", s: "down",
    arrowleft: "left", a: "left", arrowright: "right", d: "right",
  };

  const REDUCED_MOTION = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const TOUCH = matchMedia("(pointer: coarse)").matches;

  const ICONS = {
    soundOn:  '<svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M16 9a4 4 0 0 1 0 6M18.5 6.5a8 8 0 0 1 0 11"/></svg>',
    soundOff: '<svg viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6L8 10z"/><path d="M17 10l4 4M21 10l-4 4"/></svg>',
    play:     '<svg viewBox="0 0 20 20"><path d="M6 3.5v13l11-6.5z"/></svg>',
    pause:    '<svg viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1.5"/></svg>',
    retry:    '<svg viewBox="0 0 20 20"><path d="M10 3a7 7 0 1 0 7 7h-2.4A4.6 4.6 0 1 1 10 5.4V8l4-3.5L10 1z"/></svg>',
  };

  /* =========================================================
     STORAGE
     ========================================================= */
  const load = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const save = (k, v) => { try { localStorage.setItem(k, String(v)); } catch { /* ignore */ } };

  /* =========================================================
     SOUND (soft sine blips)
     ========================================================= */
  let audioCtx = null;
  let muted = load(MUTE_KEY) === "1";

  // Browsers only allow audio after a user gesture, so every input handler calls this.
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === "suspended") audioCtx.resume();
    } catch { audioCtx = null; }
  }

  function beep(freq, dur, offset = 0, vol = 0.08, type = "sine") {
    if (muted || !audioCtx) return;
    const t = audioCtx.currentTime + offset;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.setValueAtTime(freq, t);
    gain.gain.setValueAtTime(0.0001, t);
    gain.gain.exponentialRampToValueAtTime(vol, t + 0.01);
    gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    osc.connect(gain).connect(audioCtx.destination);
    osc.start(t);
    osc.stop(t + dur + 0.02);
  }

  const sfx = {
    eat()   { beep(740, 0.08); beep(1110, 0.1, 0.05); },
    bonus() { [660, 880, 1100, 1320].forEach((f, i) => beep(f, 0.08, i * 0.05)); },
    level() { [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.12, i * 0.09)); },
    start() { beep(660, 0.08); beep(990, 0.12, 0.07); },
    pause() { beep(520, 0.08); },
    over()  { beep(330, 0.2, 0, 0.1, "triangle"); beep(220, 0.35, 0.18, 0.1, "triangle"); },
    win()   { [523, 659, 784, 1047, 1319].forEach((f, i) => beep(f, 0.15, i * 0.12)); },
  };

  const buzz = ms => { try { navigator.vibrate && navigator.vibrate(ms); } catch { /* ignore */ } };

  /* =========================================================
     GAME ENGINE
     ========================================================= */
  const same = (a, b) => a.x === b.x && a.y === b.y;

  class Game {
    constructor() { this.reset(); }

    reset() {
      const cx = COLS >> 1, cy = ROWS >> 1;
      // 3 blocks in the middle, moving right
      this.snake = [{ x: cx, y: cy }, { x: cx - 1, y: cy }, { x: cx - 2, y: cy }];
      this.dir = DIRS.right;
      this.queue = [];     // buffered turns, applied one per step
      this.prev = null;    // positions before the last step (for smooth drawing)
      this.score = 0;
      this.eaten = 0;
      this.bonus = null;   // {x, y, left}
      this.food = null;
      this.food = this.freeCell();
    }

    get level() { return Math.floor(this.eaten / FOODS_PER_LEVEL) + 1; }
    get delay() { return Math.max(MIN_DELAY, BASE_DELAY - (this.level - 1) * SPEED_STEP); }
    get toNextLevel() { return FOODS_PER_LEVEL - (this.eaten % FOODS_PER_LEVEL); }

    // Random cell not covered by the snake, food or bonus. null if none left.
    freeCell() {
      const taken = new Set(this.snake.map(s => s.y * COLS + s.x));
      if (this.food) taken.add(this.food.y * COLS + this.food.x);
      if (this.bonus) taken.add(this.bonus.y * COLS + this.bonus.x);
      const free = [];
      for (let i = 0; i < COLS * ROWS; i++) if (!taken.has(i)) free.push(i);
      if (!free.length) return null;
      const i = free[Math.floor(Math.random() * free.length)];
      return { x: i % COLS, y: Math.floor(i / COLS) };
    }

    // Queue a turn. Each queued turn is checked against the direction before it,
    // so quick swipes (e.g. up then left) work but can never reverse the snake into itself.
    // Only one queued turn is applied per step.
    turn(name) {
      const next = DIRS[name];
      if (!next) return;
      const last = this.queue.length ? this.queue[this.queue.length - 1] : this.dir;
      if (next === last || (next.x === -last.x && next.y === -last.y)) return;
      if (this.queue.length < 2) this.queue.push(next);
    }

    step() {
      if (this.queue.length) this.dir = this.queue.shift();
      this.prev = this.snake.map(s => ({ ...s }));
      const head = this.snake[0];
      // Walls wrap around: leaving one side brings the snake in on the opposite side.
      const next = {
        x: (head.x + this.dir.x + COLS) % COLS,
        y: (head.y + this.dir.y + ROWS) % ROWS,
      };

      const eating = this.food && same(next, this.food);
      // The tail leaves its cell this step unless we grow, so that cell is safe.
      const body = eating ? this.snake : this.snake.slice(0, -1);
      if (body.some(s => same(s, next))) return { dead: true };

      this.snake.unshift(next);
      const r = {};

      if (this.bonus && same(next, this.bonus)) {
        r.bonus = 2 + Math.ceil((this.bonus.left / BONUS_STEPS) * 8);   // 3..10, quicker = more
        r.at = { ...next };
        this.score += r.bonus;
        this.bonus = null;
      }

      if (eating) {
        this.score++;
        this.eaten++;
        r.ate = true;
        r.at = r.at || { ...next };
        this.food = null;
        this.food = this.freeCell();
        if (this.eaten % FOODS_PER_LEVEL === 0) {
          r.levelUp = true;
          this.bonus = null;
          const cell = this.freeCell();
          if (cell) this.bonus = { ...cell, left: BONUS_STEPS };
        }
        if (!this.food) r.won = true;
      } else {
        this.snake.pop();
      }

      if (this.bonus && !r.levelUp && --this.bonus.left <= 0) this.bonus = null;
      return r;
    }
  }

  /* =========================================================
     DOM
     ========================================================= */
  const $ = id => document.getElementById(id);
  const canvas = $("canvas");
  const ctx = canvas.getContext("2d");
  const board = $("board");
  const toast = $("toast");
  const statusEl = $("status");
  const barText = $("barText");
  const foot = $("foot");
  const scoreEl = $("score"), levelEl = $("level"), bestEl = $("best");
  const timer = $("timer"), timerBar = $("timerBar");
  const btnGo = $("btnGo"), btnSound = $("btnSound"), btnFull = $("btnFull");

  /* =========================================================
     RENDERING: dot grid, snake and food are round dots centred on cells
     ========================================================= */
  let cell = 16;
  const gridLayer = document.createElement("canvas");   // static dot grid, drawn once per resize

  function resize() {
    const dpr = window.devicePixelRatio || 1;
    const next = Math.max(8, Math.floor((canvas.clientWidth * dpr) / COLS));
    if (next === cell && canvas.width === next * COLS) return;
    cell = next;
    canvas.width = canvas.height = gridLayer.width = gridLayer.height = cell * COLS;

    const g = gridLayer.getContext("2d");
    g.fillStyle = C.grid;
    const r = Math.max(1, cell * 0.06);
    for (let y = 0; y < ROWS; y++) {
      for (let x = 0; x < COLS; x++) {
        g.beginPath();
        g.arc((x + 0.5) * cell, (y + 0.5) * cell, r, 0, Math.PI * 2);
        g.fill();
      }
    }
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  const centre = p => [(p.x + 0.5) * cell, (p.y + 0.5) * cell];

  function dot(x, y, r, color, alpha = 1) {
    ctx.globalAlpha = alpha;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }

  // How far the snake is through the current step (0 = just moved, 1 = about to move).
  // The game logic still moves one whole cell per step; this only makes the drawing glide.
  function stepProgress() {
    if (REDUCED_MOTION || !game.prev) return 1;
    if (state === "running" || state === "paused") return Math.min(1, acc / game.delay);
    return 1;
  }

  // Drawn position of segment i, in cell units, sliding from its previous cell to its current one
  function segmentPos(i, p) {
    const c = game.snake[i];
    const f = (game.prev && game.prev[i]) || c;
    let dx = c.x - f.x, dy = c.y - f.y;
    // Wrapped through an edge: it really moved one cell outward, not across the board
    if (dx > 1) dx = -1; else if (dx < -1) dx = 1;
    if (dy > 1) dy = -1; else if (dy < -1) dy = 1;
    return { x: c.x - dx * (1 - p), y: c.y - dy * (1 - p) };
  }

  // Run fn at a position, plus its copy on the opposite side while it slides through an edge
  function atWrapped(pos, fn) {
    const xs = [pos.x], ys = [pos.y];
    if (pos.x < 0) xs.push(pos.x + COLS); else if (pos.x > COLS - 1) xs.push(pos.x - COLS);
    if (pos.y < 0) ys.push(pos.y + ROWS); else if (pos.y > ROWS - 1) ys.push(pos.y - ROWS);
    for (const x of xs) for (const y of ys) fn((x + 0.5) * cell, (y + 0.5) * cell);
  }

  function drawSnake(t, dead) {
    const s = game.snake;
    const color = dead ? C.dead : C.blue;
    const p = stepProgress();

    // Body: separate round dots, a little smaller and lighter towards the tail
    for (let i = s.length - 1; i >= 1; i--) {
      const k = s.length > 1 ? i / (s.length - 1) : 0;
      atWrapped(segmentPos(i, p), (x, y) => dot(x, y, cell * (0.36 - 0.08 * k), color, 1 - 0.45 * k));
    }

    // Head: bigger dot with two little eyes facing the way it moves
    const d = game.dir;
    const side = { x: -d.y, y: d.x };
    atWrapped(segmentPos(0, p), (hx, hy) => {
      dot(hx, hy, cell * 0.44, color);
      for (const k of [-1, 1]) {
        const ex = hx + d.x * cell * 0.1 + side.x * k * cell * 0.17;
        const ey = hy + d.y * cell * 0.1 + side.y * k * cell * 0.17;
        if (dead) {
          const r = cell * 0.08;
          ctx.strokeStyle = C.white;
          ctx.lineWidth = Math.max(1.5, cell * 0.05);
          ctx.lineCap = "round";
          ctx.beginPath();
          ctx.moveTo(ex - r, ey - r); ctx.lineTo(ex + r, ey + r);
          ctx.moveTo(ex + r, ey - r); ctx.lineTo(ex - r, ey + r);
          ctx.stroke();
        } else {
          dot(ex, ey, cell * 0.075, C.white);
        }
      }
    });
  }

  // Small dots that burst out when food is eaten
  let particles = [];
  function burst(at, n = 10) {
    if (REDUCED_MOTION) return;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + Math.random() * 0.4;
      const sp = 2.5 + Math.random() * 2.5;
      particles.push({ x: at.x + 0.5, y: at.y + 0.5, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, born: performance.now() });
    }
  }

  function drawParticles(t) {
    particles = particles.filter(p => t - p.born < 450);
    for (const p of particles) {
      const k = (t - p.born) / 1000;
      const life = 1 - (t - p.born) / 450;
      dot((p.x + p.vx * k) * cell, (p.y + p.vy * k) * cell, cell * 0.09, C.blue, life);
    }
  }

  function draw(t) {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.drawImage(gridLayer, 0, 0);   // dot-matrix grid (pre-rendered)

    // Food: a blue dot that gently pulses
    if (game.food) {
      const [x, y] = centre(game.food);
      const pulse = REDUCED_MOTION ? 0 : Math.sin(t / 220) * 0.03;
      dot(x, y, cell * (0.3 + pulse), C.blue);
    }

    // Bonus: a blue ring, blinking when about to vanish
    if (game.bonus && !(game.bonus.left <= 8 && Math.floor(t / 120) % 2)) {
      const [x, y] = centre(game.bonus);
      ctx.strokeStyle = C.blue;
      ctx.lineWidth = cell * 0.1;
      ctx.beginPath();
      ctx.arc(x, y, cell * 0.34, 0, Math.PI * 2);
      ctx.stroke();
      dot(x, y, cell * 0.12, C.blue);
    }

    const dead = state === "dying" || state === "over";
    const blinkOff = state === "dying" && Math.floor((t - stateAt) / 120) % 2 === 1;
    if (!blinkOff) drawSnake(t, dead);
    drawParticles(t);
  }

  /* =========================================================
     STATE + UI
     ========================================================= */
  // "ready" | "running" | "paused" | "dying" | "over"
  let state = "ready";
  let stateAt = 0;
  let won = false;
  const game = new Game();
  let highScore = parseInt(load(HIGH_KEY), 10) || 0;
  let highAtStart = highScore;
  let acc = 0, lastTime = 0;
  let toastTimer = 0;

  function bump(el) {
    el.classList.remove("bump");
    void el.offsetWidth;
    el.classList.add("bump");
  }

  function updateHud() {
    scoreEl.textContent = game.score;
    levelEl.textContent = game.level;
    bestEl.textContent = highScore;
  }

  function showToast(text, ms = 1400) {
    toast.textContent = text;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { toast.hidden = true; }, ms);
  }

  // Heading, composer-bar text and the round button all follow the game state.
  function renderUi() {
    const steerHint = TOUCH ? "Swipe anywhere to turn" : "Arrow keys or WASD to turn, Space to pause";
    let h1 = "", sub = "", bar = "", icon = ICONS.play, label = "Play";

    if (state === "ready") {
      h1 = "Snake";
      sub = "Eat the blue dots. Edges wrap around.";
      bar = TOUCH ? "<b>Swipe</b> to play" : "<b>Press an arrow key</b> to play";
    } else if (state === "running" || state === "dying") {
      bar = `<b>${game.toNextLevel}</b> more to level ${game.level + 1}`;
      icon = ICONS.pause; label = "Pause";
    } else if (state === "paused") {
      h1 = "Paused";
      bar = TOUCH ? "<b>Tap</b> to resume" : "<b>Space</b> to resume";
    } else if (state === "over") {
      const record = game.score > highAtStart;
      h1 = won ? "You filled the board!" : record ? "New best score!" : "Game over";
      sub = `Score ${game.score} · Best ${highScore}`;
      bar = TOUCH ? "<b>Swipe</b> or tap to play again" : "<b>Space</b> to play again";
      icon = ICONS.retry; label = "Play again";
    }

    statusEl.innerHTML = h1 ? `<h1>${h1}</h1>${sub ? `<p>${sub}</p>` : ""}` : "";
    barText.innerHTML = bar;
    btnGo.innerHTML = icon;
    btnGo.setAttribute("aria-label", label);
    foot.textContent = steerHint;

    btnSound.innerHTML = muted ? ICONS.soundOff : ICONS.soundOn;
    btnSound.setAttribute("aria-label", muted ? "Turn sound on" : "Turn sound off");
  }

  function setState(next) {
    state = next;
    stateAt = performance.now();
    renderUi();
    updateHud();
  }

  function startGame() {
    game.reset();
    highAtStart = highScore;
    won = false;
    acc = 0;
    particles = [];
    toast.hidden = true;
    sfx.start();
    setState("running");
  }

  function pause() {
    if (state !== "running") return;
    sfx.pause();
    setState("paused");
  }

  function resume() {
    if (state !== "paused") return;
    sfx.pause();
    setState("running");
  }

  function finish(didWin) {
    won = didWin;
    if (didWin) sfx.win(); else sfx.over();
    buzz(didWin ? [40, 60, 40] : 150);
    if (!didWin && !REDUCED_MOTION) {
      board.classList.remove("shake");
      void board.offsetWidth;
      board.classList.add("shake");
    }
    setState("dying");
  }

  // Round button / Space: play, pause, resume or play again
  function mainAction() {
    if (state === "ready" || state === "over") startGame();
    else if (state === "running") pause();
    else if (state === "paused") resume();
  }

  // Tap on the screen: like the button, but never pauses a running game by accident
  function tapAction() {
    if (state !== "running") mainAction();
  }

  // A swipe or arrow key: steers, and also starts a game from the ready / game-over screen
  function steer(name) {
    if (state === "ready" || state === "over") startGame();
    if (state === "running") game.turn(name);
  }

  function toggleMute() {
    muted = !muted;
    save(MUTE_KEY, muted ? "1" : "0");
    if (!muted) beep(880, 0.08);
    renderUi();
    showToast(muted ? "Sound off" : "Sound on", 900);
  }

  // Full screen is optional: some browsers don't allow it
  function toggleFullscreen() {
    try {
      const p = document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
      if (p && p.catch) p.catch(() => showToast("Full screen not available", 1200));
    } catch { showToast("Full screen not available", 1200); }
  }
  if (document.fullscreenEnabled) btnFull.hidden = false;

  function handleStep(r) {
    if (r.dead) { finish(false); return; }
    if (r.bonus) {
      sfx.bonus();
      buzz(25);
      burst(r.at, 14);
      showToast(`Bonus +${r.bonus}`, 900);
    }
    if (r.ate) {
      burst(r.at);
      if (r.levelUp) { sfx.level(); showToast(`Level ${game.level}`); bump(levelEl); }
      else if (!r.bonus) { sfx.eat(); buzz(10); }
      renderUi();
    }
    if (r.ate || r.bonus) {
      if (game.score > highScore) {
        highScore = game.score;
        save(HIGH_KEY, highScore);
      }
      updateHud();
      bump(scoreEl);
    }
    if (r.won) finish(true);
  }

  /* =========================================================
     MAIN LOOP
     ========================================================= */
  function loop(t) {
    const dt = t - lastTime;
    lastTime = t;

    if (state === "running") {
      acc = Math.min(acc + dt, game.delay * 2);   // no fast-forward after a hiccup
      while (state === "running" && acc >= game.delay) {
        acc -= game.delay;
        handleStep(game.step());
      }
    } else if (state === "dying" && t - stateAt >= DEATH_MS) {
      setState("over");
    }

    // Bonus timer bar above the board
    const showTimer = (state === "running" || state === "paused") && !!game.bonus;
    timer.classList.toggle("on", showTimer);
    if (showTimer) timerBar.style.width = (game.bonus.left / BONUS_STEPS) * 100 + "%";

    draw(t);
    requestAnimationFrame(loop);
  }

  /* =========================================================
     INPUT
     ========================================================= */
  function press(el) {
    el.classList.add("pressed");
    setTimeout(() => el.classList.remove("pressed"), 110);
  }

  // Keyboard (desktop)
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const key = e.key.toLowerCase();
    unlockAudio();

    if (KEY_DIRS[key]) {
      e.preventDefault();
      if (state !== "dying") steer(KEY_DIRS[key]);
    } else if (key === " " || key === "enter") {
      e.preventDefault();
      if (!e.repeat) { mainAction(); press(btnGo); }
    } else if (key === "p" || key === "escape") {
      if (!e.repeat) { state === "running" ? pause() : resume(); }
    } else if (key === "m") {
      if (!e.repeat) { toggleMute(); press(btnSound); }
    } else if (key === "f") {
      if (!e.repeat && !btnFull.hidden) toggleFullscreen();
    }
  });

  // Buttons react on pointerdown (instant on phones). click with detail 0 = keyboard Enter.
  function bindButton(el, action) {
    el.addEventListener("pointerdown", e => {
      e.preventDefault();
      unlockAudio();
      action();
    });
    el.addEventListener("click", e => { if (e.detail === 0) { unlockAudio(); action(); } });
  }
  bindButton(btnGo, mainAction);
  bindButton(btnSound, toggleMute);
  bindButton(btnFull, toggleFullscreen);

  // Swipe anywhere on the screen. The turn happens as soon as the finger has moved
  // far enough (no need to lift it), and you can keep sliding to chain turns.
  let touch = null;
  const onButton = e => e.target.closest && e.target.closest("button");

  document.addEventListener("touchstart", e => {
    if (onButton(e)) return;
    e.preventDefault();
    unlockAudio();
    const t = e.changedTouches[0];
    touch = { x: t.clientX, y: t.clientY, swiped: false };
  }, { passive: false });

  document.addEventListener("touchmove", e => {
    if (!touch) return;
    e.preventDefault();
    const t = e.changedTouches[0];
    const dx = t.clientX - touch.x, dy = t.clientY - touch.y;
    if (Math.max(Math.abs(dx), Math.abs(dy)) < SWIPE_MIN) return;
    if (state !== "dying") {
      steer(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? "right" : "left") : (dy > 0 ? "down" : "up"));
    }
    touch = { x: t.clientX, y: t.clientY, swiped: true };
  }, { passive: false });

  document.addEventListener("touchend", e => {
    if (!touch) return;
    e.preventDefault();
    if (!touch.swiped) tapAction();
    touch = null;
  }, { passive: false });

  // Mouse click on the board (desktop) works like a tap
  board.addEventListener("click", () => { unlockAudio(); tapAction(); });

  document.addEventListener("visibilitychange", () => { if (document.hidden) pause(); });

  /* =========================================================
     BOOT
     ========================================================= */
  setState("ready");
  requestAnimationFrame(t => { lastTime = t; loop(t); });
})();
</script>
</body>
</html>
